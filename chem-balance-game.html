<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学方程式配平挑战 ⚗️</title>
<style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #6c5ce7;
  --primary-light: #a29bfe;
  --success: #00b894;
  --success-light: #55efc4;
  --danger: #e17055;
  --danger-light: #fab1a0;
  --warning: #fdcb6e;
  --bg: #f8f9ff;
  --card: #ffffff;
  --text: #2d3436;
  --text-light: #636e72;
  --shadow: 0 4px 24px rgba(108,92,231,0.10);
  --shadow-lg: 0 12px 40px rgba(108,92,231,0.14);
  --radius: 20px;
  --radius-sm: 12px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #e8ecff 0%, #f0e6ff 30%, #e6f3ff 60%, #fdf2ff 100%);
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ===== Decorative Background ===== */
.bg-decoration {
  position: fixed; pointer-events: none; z-index: 0;
  font-size: 120px; opacity: 0.04;
}
.bg-decoration:nth-child(1) { top: -30px; left: 5%;  transform: rotate(-15deg); }
.bg-decoration:nth-child(2) { bottom: -40px; right: 3%; transform: rotate(20deg); font-size: 100px; }
.bg-decoration:nth-child(3) { top: 40%; right: 8%; transform: rotate(10deg); font-size: 80px; }

/* ===== Main Container ===== */
.container {
  position: relative; z-index: 1;
  width: 100%; max-width: 520px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 28px 24px 24px;
  transition: all var(--transition);
}

/* ===== Header ===== */
.header {
  text-align: center; margin-bottom: 24px;
}
.header .icon { font-size: 40px; margin-bottom: 4px; }
.header h1 {
  font-size: 24px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), #e17055);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

/* ===== Score Bar ===== */
.score-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 24px; margin-bottom: 20px;
  padding: 12px 20px;
  background: linear-gradient(135deg, #f8f7ff, #fff5f5);
  border-radius: var(--radius-sm);
  flex-wrap: wrap;
}
.score-item { text-align: center; }
.score-item .label { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; }
.score-item .value { font-size: 22px; font-weight: 700; color: var(--primary); transition: all 0.3s; }
.score-item .value.pop { animation: popNum 0.5s ease; }
.score-item.combo .value { color: var(--danger); }
.combo-fire { display: inline-block; animation: flicker 0.3s infinite alternate; }

@keyframes popNum {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); color: var(--success); }
  100% { transform: scale(1); }
}

@keyframes flicker {
  from { transform: scale(1) rotate(-5deg); }
  to   { transform: scale(1.2) rotate(5deg); }
}

/* ===== Level Indicator ===== */
.level-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
  background: var(--primary); color: white;
  margin-bottom: 16px;
}
.level-badge.locked { background: #b2bec3; }

/* ===== Equation Display ===== */
.equation-area {
  background: linear-gradient(135deg, #fafbff, #fdfaff);
  border: 2px solid #eee;
  border-radius: var(--radius);
  padding: 24px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  transition: all var(--transition);
  min-height: 90px;
  position: relative;
}
.equation-area.correct-flash {
  border-color: var(--success);
  background: linear-gradient(135deg, #f0fff6, #f0fffa);
  animation: pulse 0.6s ease;
}
.equation-area.wrong-flash {
  border-color: var(--danger);
  background: linear-gradient(135deg, #fff5f5, #fff8f5);
  animation: shake 0.5s ease;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* ===== Coefficient Inputs ===== */
.coeff-input {
  width: 52px; height: 52px;
  text-align: center;
  font-size: 26px; font-weight: 700;
  border: 2.5px dashed #c8ccdd;
  border-radius: var(--radius-sm);
  background: white;
  color: var(--primary);
  outline: none;
  transition: all var(--transition);
  font-family: inherit;
  caret-color: var(--primary);
}
.coeff-input:focus {
  border-color: var(--primary);
  border-style: solid;
  box-shadow: 0 0 0 4px rgba(108,92,231,0.12);
  transform: translateY(-2px);
}
.coeff-input.filled {
  border-style: solid;
  border-color: var(--primary-light);
  background: #f8f7ff;
}
.coeff-input:disabled {
  background: #e9ecef; color: #adb5bd;
  border-color: #dee2e6; border-style: solid;
}

/* ===== Formula Text ===== */
.formula {
  font-size: 26px; font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.formula sub { font-size: 0.7em; }

.operator {
  font-size: 20px; font-weight: 300; color: var(--text-light);
  margin: 0 2px;
}
.arrow {
  font-size: 24px; margin: 0 6px;
  color: var(--primary); font-weight: 700;
}

/* ===== Buttons ===== */
.btn-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

.btn {
  flex: 1; min-width: 80px;
  padding: 14px 20px;
  border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  position: relative; overflow: hidden;
  letter-spacing: 0.5px;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), #5f27cd);
  color: white; box-shadow: 0 4px 14px rgba(108,92,231,0.35);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 6px 20px rgba(108,92,231,0.45);
  transform: translateY(-2px);
}

.btn-hint {
  background: white; color: var(--primary);
  border: 2px solid var(--primary-light);
}
.btn-hint:hover:not(:disabled) {
  background: #f8f7ff;
}

.btn-next {
  background: linear-gradient(135deg, var(--success), #00a381);
  color: white; box-shadow: 0 4px 14px rgba(0,184,148,0.3);
}

.btn-outline {
  background: white; color: var(--text);
  border: 2px solid #dfe6e9;
}

.btn-small {
  padding: 8px 16px; font-size: 13px; flex: 0;
}

/* ===== Feedback ===== */
.feedback {
  text-align: center; padding: 14px;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600;
  margin-bottom: 12px;
  display: none;
  animation: fadeInUp 0.4s ease;
}
.feedback.show { display: block; }
.feedback.correct {
  background: #e6fff8; color: #00a381;
  border: 1px solid var(--success-light);
}
.feedback.wrong {
  background: #fff5f5; color: #c0392b;
  border: 1px solid var(--danger-light);
}
.feedback.hint-msg {
  background: #fffbf0; color: #e17055;
  border: 1px solid var(--warning);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== Progress Dots ===== */
.progress-bar {
  display: flex; justify-content: center; gap: 10px; margin-bottom: 16px;
}
.progress-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #dfe6e9; transition: all var(--transition);
}
.progress-dot.correct { background: var(--success); }
.progress-dot.wrong   { background: var(--danger); }
.progress-dot.current  {
  background: var(--primary);
  box-shadow: 0 0 0 4px rgba(108,92,231,0.2);
  animation: pulse 2s infinite;
}

/* ===== Level Select Overlay ===== */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  animation: fadeIn 0.3s ease;
}
.overlay.hidden { display: none; }

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.level-select-card {
  background: white; border-radius: var(--radius);
  padding: 28px 24px; width: 90%; max-width: 440px;
  box-shadow: var(--shadow-lg);
  max-height: 85vh; overflow-y: auto;
}
.level-select-card h2 {
  text-align: center; font-size: 22px; margin-bottom: 20px;
  color: var(--primary);
}

.level-list { display: flex; flex-direction: column; gap: 10px; }

.level-row {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  background: #f8f9ff;
  cursor: pointer;
  transition: all var(--transition);
  border: 2px solid transparent;
}
.level-row:hover { border-color: var(--primary-light); transform: translateX(4px); }
.level-row.locked { opacity: 0.5; cursor: not-allowed; background: #f5f6fa; }
.level-row.locked:hover { transform: none; border-color: transparent; }
.level-row .level-num {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), #5f27cd);
  color: white; flex-shrink: 0;
}
.level-row.locked .level-num { background: #b2bec3; }
.level-row .level-info { flex: 1; }
.level-row .level-name { font-weight: 700; font-size: 15px; }
.level-row .level-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.level-row .stars { font-size: 18px; letter-spacing: 2px; }

/* ===== Level Complete Modal ===== */
.complete-card {
  text-align: center;
}
.complete-card .big-stars { font-size: 48px; letter-spacing: 6px; margin: 16px 0; }
.complete-card .complete-msg { font-size: 20px; font-weight: 700; margin: 8px 0; }
.complete-card .score-earned { font-size: 36px; font-weight: 800; color: var(--primary); }

.star-animate {
  display: inline-block;
  animation: starPop 0.5s ease backwards;
}
.star-animate:nth-child(1) { animation-delay: 0.1s; }
.star-animate:nth-child(2) { animation-delay: 0.3s; }
.star-animate:nth-child(3) { animation-delay: 0.5s; }

@keyframes starPop {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* ===== Confetti Particles ===== */
.confetti-container {
  position: fixed; inset: 0; pointer-events: none; z-index: 200;
}
.confetti {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 3px;
  animation: confettiFall 1.2s ease-out forwards;
}

@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) scale(0); opacity: 0; }
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .container { padding: 20px 12px 16px; }
  .header h1 { font-size: 20px; }
  .equation-area { padding: 16px 8px; gap: 4px; }
  .coeff-input { width: 44px; height: 44px; font-size: 22px; }
  .formula { font-size: 22px; }
  .arrow { font-size: 20px; margin: 0 3px; }
  .btn { padding: 12px 14px; font-size: 14px; }
  .score-bar { gap: 16px; padding: 10px 14px; }
  .score-item .value { font-size: 18px; }
}

@media (max-width: 370px) {
  .coeff-input { width: 38px; height: 38px; font-size: 18px; }
  .formula { font-size: 18px; }
  .arrow { font-size: 16px; margin: 0 2px; }
  .operator { font-size: 16px; }
}
</style>
</head>
<body>

<!-- Background decorations -->
<div class="bg-decoration">🧪</div>
<div class="bg-decoration">⚗️</div>
<div class="bg-decoration">🔬</div>

<!-- Main Game -->
<div class="container" id="gameContainer">
  <!-- Header -->
  <div class="header">
    <div class="icon">⚗️</div>
    <h1>化学方程式配平挑战</h1>
    <div class="subtitle">初中化学 · 互动练习</div>
  </div>

  <!-- Score Bar -->
  <div class="score-bar">
    <div class="score-item">
      <div class="label">⭐ 积分</div>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="score-item combo">
      <div class="label">🔥 连击</div>
      <div class="value" id="comboDisplay">×1</div>
    </div>
    <div class="score-item">
      <div class="label">📝 题目</div>
      <div class="value" id="questionCount">0/5</div>
    </div>
  </div>

  <!-- Level Badge -->
  <div style="text-align:center;">
    <span class="level-badge" id="levelBadge">第 1 关 · 初出茅庐</span>
  </div>

  <!-- Progress Dots -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Equation Area -->
  <div class="equation-area" id="equationArea">
    <!-- Dynamically filled -->
  </div>

  <!-- Feedback -->
  <div class="feedback" id="feedback"></div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-hint btn-small" id="btnHint" title="消耗5积分获得提示">💡 提示</button>
    <button class="btn btn-primary" id="btnSubmit">✅ 提交答案</button>
    <button class="btn btn-outline btn-small" id="btnLevels">📋 选关</button>
  </div>
  <button class="btn btn-next" id="btnNext" style="display:none; width:100%;">下一题 ➡️</button>
</div>

<!-- Level Select Overlay -->
<div class="overlay hidden" id="levelOverlay">
  <div class="level-select-card">
    <h2>🗺️ 选择关卡</h2>
    <div class="level-list" id="levelList"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:16px;" id="btnCloseLevels">关闭</button>
  </div>
</div>

<!-- Level Complete Overlay -->
<div class="overlay hidden" id="completeOverlay">
  <div class="level-select-card complete-card" id="completeCard"></div>
</div>

<!-- Confetti Container -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ============================================================
//  题库数据
// ============================================================
const QUESTION_BANK = [
  // ---- 第1关：初出茅庐 (化合 & 分解基础) ----
  { id: 1, left:['C', 'O₂'], right:['CO₂'], ans:[1,1,1], diff:1,
    hint1:'所有元素的原子数左右已经相等，再仔细观察一下！',
    hint2:'试试三个空都填 1' },
  { id: 2, left:['S', 'O₂'], right:['SO₂'], ans:[1,1,1], diff:1,
    hint1:'硫(S)和氧(O)原子数左右各是多少？',
    hint2:'试试三个空都填 1' },
  { id: 3, left:['Mg', 'O₂'], right:['MgO'], ans:[2,1,2], diff:1,
    hint1:'注意镁(Mg)和氧(O)原子的数量变化',
    hint2:'第一个空填 2，第三个空填 2' },
  { id: 4, left:['H₂O'], right:['H₂','O₂'], ans:[2,2,1], diff:1,
    hint1:'水通电分解，先配氢(H)还是先配氧(O)？',
    hint2:'第一个空填 2，第二个空填 2' },
  { id: 5, left:['Na', 'Cl₂'], right:['NaCl'], ans:[2,1,2], diff:1,
    hint1:'钠(Na)和氯(Cl)原子各有多少个？',
    hint2:'第一个空填 2，第三个空填 2' },

  // ---- 第2关：渐入佳境 ----
  { id: 6, left:['H₂', 'O₂'], right:['H₂O'], ans:[2,1,2], diff:2,
    hint1:'先配氢(H)再配氧(O)，想想它们分别在哪些物质中出现',
    hint2:'第一个空填 2，第三个空填 2' },
  { id: 7, left:['CO', 'O₂'], right:['CO₂'], ans:[2,1,2], diff:2,
    hint1:'碳(C)原子数已经相等，重点看氧(O)',
    hint2:'第一个空填 2，第二个空填 1' },
  { id: 8, left:['H₂O₂'], right:['H₂O','O₂'], ans:[2,2,1], diff:2,
    hint1:'过氧化氢分解，氧(O)原子出现在两个生成物中',
    hint2:'第一个空填 2，第三个空填 1' },
  { id: 9, left:['N₂', 'H₂'], right:['NH₃'], ans:[1,3,2], diff:2,
    hint1:'这是合成氨反应，氢(H)原子数左右相差较大',
    hint2:'第二个空填 3，第三个空填 2' },
  { id:10, left:['Fe', 'O₂'], right:['Fe₃O₄'], ans:[3,2,1], diff:2,
    hint1:'铁在氧气中燃烧，生成物有3个铁(Fe)原子',
    hint2:'第一个空填 3，第二个空填 2' },

  // ---- 第3关：炉火纯青 ----
  { id:11, left:['P', 'O₂'], right:['P₂O₅'], ans:[4,5,2], diff:3,
    hint1:'磷(P)和氧(O)原子数都不等，需要同时考虑',
    hint2:'第一个空填 4，第二个空填 5' },
  { id:12, left:['Al', 'O₂'], right:['Al₂O₃'], ans:[4,3,2], diff:3,
    hint1:'铝(Al)原子在右侧有2个，氧(O)原子在右侧有3个',
    hint2:'第一个空填 4，第二个空填 3' },
  { id:13, left:['KClO₃'], right:['KCl','O₂'], ans:[2,2,3], diff:3,
    hint1:'氯酸钾分解，氧(O)原子在反应物中有3个',
    hint2:'第一个空填 2，第三个空填 3' },
  { id:14, left:['HgO'], right:['Hg','O₂'], ans:[2,2,1], diff:3,
    hint1:'氧化汞分解，氧(O)以O₂形式放出',
    hint2:'第一个空填 2，第二个空填 2' },
  { id:15, left:['CaO', 'H₂O'], right:['Ca(OH)₂'], ans:[1,1,1], diff:3,
    hint1:'氧化钙与水化合，仔细数每种原子数',
    hint2:'三个空都填 1 试试看' },
];

// 关卡定义
const LEVELS = [
  { id:1, name:'初出茅庐', desc:'化合与分解反应基础',  icon:'🌱', qIds:[1,2,3,4,5],   passNeed:4 },
  { id:2, name:'渐入佳境', desc:'常见的配平技巧练习',    icon:'💪', qIds:[6,7,8,9,10],  passNeed:4 },
  { id:3, name:'炉火纯青', desc:'较复杂的方程式挑战',    icon:'🔥', qIds:[11,12,13,14,15], passNeed:4 },
];

const COMBO_MULTIPLIER = [1, 1, 1.5, 2, 2.5, 3];
const BASE_SCORE = 10;
const HINT_COST = 5;

// ============================================================
//  游戏状态
// ============================================================
const state = {
  currentLevelId: 1,
  questionIndex: 0,          // 当前题目在关卡中的索引
  questions: [],             // 当前关卡的题目列表
  currentQuestion: null,
  combo: 0,
  totalScore: 0,
  levelResults: [],          // [{ correct:bool, attempts:int, hintsUsed:int }]
  hintLevel: 0,              // 当前题目已使用的提示次数 (0/1/2)
  answered: false,           // 当前题目是否已答对
  levelProgress: {},         // localStorage: { levelId: { stars, bestScore, unlocked } }
};

// ============================================================
//  DOM 缓存
// ============================================================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const dom = {
  gameContainer: $('#gameContainer'),
  equationArea: $('#equationArea'),
  feedback: $('#feedback'),
  scoreDisplay: $('#scoreDisplay'),
  comboDisplay: $('#comboDisplay'),
  questionCount: $('#questionCount'),
  levelBadge: $('#levelBadge'),
  progressBar: $('#progressBar'),
  btnSubmit: $('#btnSubmit'),
  btnHint: $('#btnHint'),
  btnNext: $('#btnNext'),
  btnLevels: $('#btnLevels'),
  levelOverlay: $('#levelOverlay'),
  levelList: $('#levelList'),
  btnCloseLevels: $('#btnCloseLevels'),
  completeOverlay: $('#completeOverlay'),
  completeCard: $('#completeCard'),
  confettiContainer: $('#confettiContainer'),
};

// ============================================================
//  本地存储
// ============================================================
const STORAGE_KEY = 'chem_balance_progress';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state.levelProgress = JSON.parse(raw);
    }
  } catch(e) { /* ignore */ }
  // 默认解锁第1关
  if (!state.levelProgress[1]) {
    state.levelProgress[1] = { unlocked: true, stars: 0, bestScore: 0 };
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.levelProgress));
  } catch(e) { /* ignore */ }
}

// ============================================================
//  关卡管理
// ============================================================
function isLevelUnlocked(levelId) {
  if (levelId === 1) return true;
  // 前一关至少1星才解锁
  const prev = state.levelProgress[levelId - 1];
  return prev && prev.stars >= 1;
}

function getLevelStars(levelId) {
  return (state.levelProgress[levelId] && state.levelProgress[levelId].stars) || 0;
}

function getLevelById(id) {
  return LEVELS.find(l => l.id === id);
}

// ============================================================
//  渲染关卡选择
// ============================================================
function renderLevelSelect() {
  dom.levelList.innerHTML = LEVELS.map(lv => {
    const unlocked = isLevelUnlocked(lv.id);
    const stars = getLevelStars(lv.id);
    const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    return `
      <div class="level-row ${unlocked ? '' : 'locked'}"
           data-level="${lv.id}"
           onclick="${unlocked ? `selectLevel(${lv.id})` : ''}">
        <div class="level-num">${lv.icon}</div>
        <div class="level-info">
          <div class="level-name">第${lv.id}关 · ${lv.name}</div>
          <div class="level-desc">${lv.desc}</div>
        </div>
        <div class="stars">${starStr}</div>
      </div>`;
  }).join('');
  dom.levelOverlay.classList.remove('hidden');
}

function selectLevel(levelId) {
  if (!isLevelUnlocked(levelId)) return;
  state.currentLevelId = levelId;
  dom.levelOverlay.classList.add('hidden');
  startLevel(levelId);
}

// ============================================================
//  开始关卡
// ============================================================
function startLevel(levelId) {
  const lv = getLevelById(levelId);
  if (!lv) return;

  state.currentLevelId = levelId;
  state.questionIndex = 0;
  state.combo = 0;
  state.levelResults = [];
  state.questions = lv.qIds
    .map(qId => QUESTION_BANK.find(q => q.id === qId))
    .filter(Boolean)
    .sort(() => Math.random() - 0.5); // 随机排列

  updateScoreDisplay();
  updateComboDisplay();
  updateQuestionCount();
  updateLevelBadge();
  renderProgress();
  showQuestion(0);
  dom.feedback.classList.remove('show', 'correct', 'wrong', 'hint-msg');
  dom.feedback.textContent = '';
  dom.btnNext.style.display = 'none';
  dom.btnSubmit.style.display = '';
  dom.btnHint.style.display = '';
}

function showQuestion(index) {
  state.questionIndex = index;
  state.currentQuestion = state.questions[index];
  state.hintLevel = 0;
  state.answered = false;

  renderEquation();
  renderProgress();
  updateQuestionCount();
  dom.feedback.classList.remove('show', 'correct', 'wrong', 'hint-msg');
  dom.feedback.textContent = '';
  dom.btnNext.style.display = 'none';
  dom.btnSubmit.style.display = '';
  dom.btnHint.style.display = '';
  dom.btnSubmit.textContent = '✅ 提交答案';
  dom.equationArea.classList.remove('correct-flash', 'wrong-flash');

  // 自动聚焦第一个输入框
  setTimeout(() => {
    const first = dom.equationArea.querySelector('.coeff-input');
    if (first) first.focus();
  }, 100);
}

// ============================================================
//  渲染方程式
// ============================================================
function renderEquation() {
  const q = state.currentQuestion;
  let html = '';

  // 左边（反应物）
  q.left.forEach((formula, i) => {
    if (i > 0) html += '<span class="operator">+</span>';
    html += `<input type="number" class="coeff-input" data-index="${i}" inputmode="numeric" min="0" max="99" placeholder="?" autocomplete="off">`;
    html += `<span class="formula">${formula}</span>`;
  });

  html += '<span class="arrow">→</span>';

  // 右边（生成物）
  q.right.forEach((formula, i) => {
    if (i > 0) html += '<span class="operator">+</span>';
    const idx = q.left.length + i;
    html += `<input type="number" class="coeff-input" data-index="${idx}" inputmode="numeric" min="0" max="99" placeholder="?" autocomplete="off">`;
    html += `<span class="formula">${formula}</span>`;
  });

  dom.equationArea.innerHTML = html;

  // 绑定输入事件
  dom.equationArea.querySelectorAll('.coeff-input').forEach(inp => {
    inp.addEventListener('input', onInputChange);
    inp.addEventListener('keydown', onInputKeydown);
    inp.addEventListener('focus', () => {
      if (state.answered) return;
      dom.equationArea.classList.remove('correct-flash', 'wrong-flash');
      dom.feedback.classList.remove('show', 'correct', 'wrong', 'hint-msg');
    });
  });
}

function onInputChange(e) {
  const inp = e.target;
  // 限制输入范围
  let val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) { inp.value = ''; inp.classList.remove('filled'); return; }
  if (val > 99) { inp.value = '99'; }
  inp.classList.add('filled');
}

function onInputKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitAnswer();
  }
  // 自动跳转到下一个输入框
  if (e.key === 'ArrowRight' || e.key === 'Tab') {
    // Tab 默认行为即可
  }
}

// ============================================================
//  获取用户输入的系数
// ============================================================
function getUserCoefficients() {
  const inputs = dom.equationArea.querySelectorAll('.coeff-input');
  const coeffs = [];
  inputs.forEach(inp => {
    const val = parseInt(inp.value, 10);
    // 空白视为 1（化学惯例：系数为1不写）
    coeffs.push(isNaN(val) || val < 1 ? 1 : val);
  });
  return coeffs;
}

// ============================================================
//  提交答案
// ============================================================
function submitAnswer() {
  if (state.answered) return;

  const q = state.currentQuestion;
  const userAns = getUserCoefficients();
  const correctAns = q.ans;

  // 判断是否正确（严格匹配最简整数比）
  const isCorrect = arraysEqual(userAns, correctAns);

  state.levelResults.push({
    correct: isCorrect,
    attempts: 1,
    hintsUsed: state.hintLevel,
  });

  if (isCorrect) {
    handleCorrect(userAns);
  } else {
    handleWrong(userAns, correctAns);
  }
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  return a.every((v, i) => v === b[i]);
}

// ============================================================
//  答对处理
// ============================================================
function handleCorrect(userAns) {
  state.answered = true;
  state.combo = Math.min(state.combo + 1, COMBO_MULTIPLIER.length - 1);
  const multiplier = COMBO_MULTIPLIER[state.combo];
  const earned = Math.round(BASE_SCORE * multiplier);
  state.totalScore += earned;

  // 更新关卡最高分
  const lp = state.levelProgress[state.currentLevelId] || { unlocked: true, stars: 0, bestScore: 0 };
  lp.bestScore = Math.max(lp.bestScore, state.totalScore);
  lp.unlocked = true;
  state.levelProgress[state.currentLevelId] = lp;
  saveProgress();

  // UI 反馈
  dom.equationArea.classList.add('correct-flash');
  dom.feedback.textContent = getCorrectMessage();
  dom.feedback.className = 'feedback correct show';

  updateScoreDisplay();
  animateScore();
  updateComboDisplay();
  renderProgress();
  spawnConfetti();

  // 按钮状态
  dom.btnSubmit.style.display = 'none';
  dom.btnHint.style.display = 'none';

  // 检查关卡是否完成
  const isLastQ = state.questionIndex >= state.questions.length - 1;
  if (isLastQ) {
    dom.btnNext.textContent = '🏆 查看成绩';
    dom.btnNext.style.display = '';
    dom.btnNext.onclick = finishLevel;
  } else {
    dom.btnNext.textContent = '下一题 ➡️';
    dom.btnNext.style.display = '';
    dom.btnNext.onclick = () => showQuestion(state.questionIndex + 1);
    // 自动前进
    setTimeout(() => {
      dom.btnNext.focus();
    }, 500);
  }

  // 禁用输入
  disableInputs();
}

// ============================================================
//  答错处理
// ============================================================
function handleWrong(userAns, correctAns) {
  state.combo = 0;
  updateComboDisplay();

  dom.equationArea.classList.add('wrong-flash');

  // 分析哪个位置错了
  const wrongPositions = [];
  userAns.forEach((v, i) => {
    if (v !== correctAns[i]) wrongPositions.push(i);
  });

  const wrongLabels = wrongPositions.map(i => `第${i+1}个空`).join('、');
  dom.feedback.textContent = `😅 还差一点！${wrongLabels}不对哦，再想想吧～`;
  dom.feedback.className = 'feedback wrong show';

  // 显示正确答案提示（在反馈中）
  if (state.levelResults.filter(r => !r.correct).length >= 2) {
    // 已经错了两题以上，显示正确答案
    const correctStr = correctAns.map((c, i) => `第${i+1}个空 = ${c}`).join('，');
    dom.feedback.textContent += `\n📝 正确答案：${correctStr}`;
  }

  // 清除输入，让学生重试
  setTimeout(() => {
    dom.equationArea.classList.remove('wrong-flash');
    clearInputs();
    const first = dom.equationArea.querySelector('.coeff-input');
    if (first) first.focus();
  }, 800);
}

// ============================================================
//  提示系统
// ============================================================
function useHint() {
  if (state.answered) return;
  if (state.totalScore < HINT_COST) {
    dom.feedback.textContent = '😅 积分不足！需要5积分才能使用提示';
    dom.feedback.className = 'feedback hint-msg show';
    setTimeout(() => dom.feedback.classList.remove('show'), 2000);
    return;
  }

  state.totalScore = Math.max(0, state.totalScore - HINT_COST);
  state.hintLevel++;
  updateScoreDisplay();

  const q = state.currentQuestion;

  if (state.hintLevel === 1) {
    // 第一级提示：通用技巧
    dom.feedback.textContent = `💡 ${q.hint1}`;
    dom.feedback.className = 'feedback hint-msg show';
  } else {
    // 第二级提示：直接给出一个系数
    dom.feedback.textContent = `💡 ${q.hint2}`;
    dom.feedback.className = 'feedback hint-msg show';
    // 填入提示的系数
    fillHintCoefficient(q);
  }

  if (state.hintLevel >= 2) {
    dom.btnHint.disabled = true;
    dom.btnHint.textContent = '💡 已用完';
  }
}

function fillHintCoefficient(q) {
  // 解析 hint2，提取第一个数字和位置
  const hint = q.hint2;
  const match = hint.match(/第(\d)个空填\s*(\d+)/);
  if (match) {
    const pos = parseInt(match[1], 10) - 1; // 0-indexed
    const val = match[2];
    const inputs = dom.equationArea.querySelectorAll('.coeff-input');
    if (inputs[pos]) {
      inputs[pos].value = val;
      inputs[pos].classList.add('filled');
    }
  }
}

// ============================================================
//  完成关卡
// ============================================================
function finishLevel() {
  const totalQ = state.levelResults.length;
  const correctCount = state.levelResults.filter(r => r.correct).length;
  const lv = getLevelById(state.currentLevelId);
  const passed = correctCount >= lv.passNeed;

  // 计算星级
  let stars = 0;
  if (passed) {
    const allCorrect = correctCount === totalQ;
    const noHints = state.levelResults.every(r => r.hintsUsed === 0);
    const firstAttemptAll = state.levelResults.every(r => r.attempts === 1);

    if (allCorrect && noHints && firstAttemptAll) stars = 3;
    else if (allCorrect && noHints) stars = 2;
    else stars = 1;
  }

  // 保存
  const lp = state.levelProgress[state.currentLevelId] || { unlocked: true, stars: 0, bestScore: 0 };
  lp.stars = Math.max(lp.stars, stars);
  lp.bestScore = Math.max(lp.bestScore, state.totalScore);
  lp.unlocked = true;
  state.levelProgress[state.currentLevelId] = lp;

  // 解锁下一关
  if (passed && state.currentLevelId < LEVELS.length) {
    const nextLp = state.levelProgress[state.currentLevelId + 1] || { stars: 0, bestScore: 0 };
    nextLp.unlocked = true;
    state.levelProgress[state.currentLevelId + 1] = nextLp;
  }

  saveProgress();

  // 显示结算界面
  showLevelComplete(stars, correctCount, totalQ, passed);
}

function showLevelComplete(stars, correctCount, totalQ, passed) {
  const starIcons = ['', '⭐', '⭐⭐', '🌟🌟🌟'][stars];
  const emptyStars = '☆'.repeat(3 - stars);

  let msg, emoji;
  if (stars === 3) { msg = '完美通关！你是化学小天才！'; emoji = '🏆'; }
  else if (stars === 2) { msg = '非常棒！继续加油！'; emoji = '🎉'; }
  else if (stars === 1) { msg = '通关成功！再来一次追求更高星级吧！'; emoji = '👍'; }
  else { msg = '还差一点，再试一次吧！'; emoji = '💪'; }

  const lv = getLevelById(state.currentLevelId);
  const hasNext = passed && state.currentLevelId < LEVELS.length;

  dom.completeCard.innerHTML = `
    <div style="font-size:48px;">${emoji}</div>
    <div class="big-stars">
      ${stars > 0
        ? Array.from({length:stars}, (_,i) => `<span class="star-animate" style="animation-delay:${i*0.2}s">⭐</span>`).join('')
        : '☆☆☆'}
      ${emptyStars}
    </div>
    <div class="complete-msg">${msg}</div>
    <p style="color:var(--text-light); margin:8px 0;">
      答对 <b>${correctCount}</b> / ${totalQ} 题 · 第${lv.name}
    </p>
    <p style="color:var(--text-light);">
      当前总积分：<b style="color:var(--primary); font-size:24px;">${state.totalScore}</b>
    </p>
    <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
      <button class="btn btn-outline btn-small" onclick="retryLevel()">🔄 重试本关</button>
      ${hasNext ? `<button class="btn btn-primary" onclick="goNextLevel()">▶️ 进入第${state.currentLevelId+1}关</button>` : ''}
      <button class="btn btn-outline btn-small" onclick="closeComplete()">📋 返回选关</button>
    </div>
  `;

  dom.completeOverlay.classList.remove('hidden');
  spawnConfetti();
}

function retryLevel() {
  dom.completeOverlay.classList.add('hidden');
  startLevel(state.currentLevelId);
}

function goNextLevel() {
  dom.completeOverlay.classList.add('hidden');
  selectLevel(state.currentLevelId + 1);
}

function closeComplete() {
  dom.completeOverlay.classList.add('hidden');
  renderLevelSelect();
}

// ============================================================
//  辅助 UI
// ============================================================
function disableInputs() {
  dom.equationArea.querySelectorAll('.coeff-input').forEach(inp => {
    inp.disabled = true;
  });
}

function clearInputs() {
  dom.equationArea.querySelectorAll('.coeff-input').forEach(inp => {
    inp.value = '';
    inp.classList.remove('filled');
  });
}

function updateScoreDisplay() {
  dom.scoreDisplay.textContent = state.totalScore;
}

function animateScore() {
  dom.scoreDisplay.classList.remove('pop');
  void dom.scoreDisplay.offsetWidth; // reflow
  dom.scoreDisplay.classList.add('pop');
}

function updateComboDisplay() {
  if (state.combo >= 2) {
    dom.comboDisplay.innerHTML = `<span class="combo-fire">🔥</span> ×${COMBO_MULTIPLIER[state.combo]}`;
    dom.comboDisplay.style.color = '#e17055';
  } else {
    dom.comboDisplay.innerHTML = '×1';
    dom.comboDisplay.style.color = '';
  }
}

function updateQuestionCount() {
  dom.questionCount.textContent = `${state.questionIndex + 1}/${state.questions.length}`;
}

function updateLevelBadge() {
  const lv = getLevelById(state.currentLevelId);
  dom.levelBadge.textContent = `${lv.icon} 第${lv.id}关 · ${lv.name}`;
}

function renderProgress() {
  let dots = '';
  for (let i = 0; i < state.questions.length; i++) {
    let cls = '';
    if (i < state.levelResults.length) {
      cls = state.levelResults[i].correct ? 'correct' : 'wrong';
    } else if (i === state.questionIndex) {
      cls = 'current';
    }
    dots += `<div class="progress-dot ${cls}"></div>`;
  }
  dom.progressBar.innerHTML = dots;
}

// ============================================================
//  鼓励语
// ============================================================
function getCorrectMessage() {
  const combo = state.combo;
  const messages = [
    '答对了！干得漂亮！🎉',
    '完全正确！你是化学小能手！✨',
    '太厉害了！继续保持！💪',
    '满分操作！连击不断！🔥',
    '无敌了！化学方程式根本难不倒你！👑',
    '传说中的配平大师就是你！🧪⚡',
  ];

  if (combo >= 5) return messages[5];
  if (combo >= 4) return messages[4];
  if (combo >= 3) return messages[3];
  if (combo >= 2) return messages[2];
  return messages[Math.min(combo, messages.length - 1)];
}

// ============================================================
//  撒花特效
// ============================================================
function spawnConfetti() {
  const colors = ['#6c5ce7','#00b894','#e17055','#fdcb6e','#74b9ff','#fd79a8','#00cec9','#fab1a0'];
  const frag = document.createDocumentFragment();

  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = `${Math.random() * 100}%`;
    el.style.top = `${Math.random() * -20 - 10}px`;
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = `${1 + Math.random() * 2}s`;
    el.style.animationDelay = `${Math.random() * 0.6}s`;
    el.style.width = `${8 + Math.random() * 12}px`;
    el.style.height = `${6 + Math.random() * 10}px`;
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    frag.appendChild(el);
  }

  dom.confettiContainer.appendChild(frag);

  // 动画结束后清理
  setTimeout(() => {
    dom.confettiContainer.innerHTML = '';
  }, 3000);
}

// ============================================================
//  事件绑定
// ============================================================
dom.btnSubmit.addEventListener('click', submitAnswer);
dom.btnHint.addEventListener('click', useHint);
dom.btnLevels.addEventListener('click', renderLevelSelect);
dom.btnCloseLevels.addEventListener('click', () => dom.levelOverlay.classList.add('hidden'));
dom.levelOverlay.addEventListener('click', (e) => {
  if (e.target === dom.levelOverlay) dom.levelOverlay.classList.add('hidden');
});
dom.completeOverlay.addEventListener('click', (e) => {
  if (e.target === dom.completeOverlay) dom.completeOverlay.classList.add('hidden');
});

// ============================================================
//  初始化
// ============================================================
function init() {
  loadProgress();

  // 默认开始第1关，或上次未完成的关卡
  let startLv = 1;
  for (let i = LEVELS.length; i >= 1; i--) {
    if (isLevelUnlocked(i)) { startLv = i; break; }
  }
  state.currentLevelId = startLv;
  state.totalScore = (state.levelProgress[startLv] && state.levelProgress[startLv].bestScore) || 0;
  updateScoreDisplay();
  startLevel(startLv);
}

init();

console.log('🧪 化学方程式配平挑战已就绪！');
console.log('📝 共 ' + LEVELS.length + ' 个关卡，' + QUESTION_BANK.length + ' 道题目');
console.log('💡 提示消耗 ' + HINT_COST + ' 积分 | 连击最高 ×' + COMBO_MULTIPLIER[COMBO_MULTIPLIER.length-1] + ' 倍积分');
console.log('📋 点击"选关"按钮选择关卡');
</script>
